# Local development — PostgreSQL + API (hot-reload)
# Usage: npm run docker:dev
# API is published on API_PORT from .env (default 3003). Do not run npm run
# start:dev on the same machine at the same time — it uses PORT from .env and
# must differ from API_PORT.
#
# Uses the stock Node image (no Dockerfile build). Image builds were failing
# with npm ETIMEDOUT against registry.npmjs.org. Deps install at container
# start via development.sh; host ~/.npm is mounted as a download cache.

name: wqms-local

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: if_not_present
    container_name: wqms-postgres-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - wqms

  api:
    image: node:22-alpine
    pull_policy: if_not_present
    container_name: wqms-api-local
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - '${API_PORT}:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - ${HOME}/.npm:/root/.npm
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/app/docker/entrypoints/development.sh']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3000/api/health").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - wqms

networks:
  wqms:
    driver: bridge

volumes:
  postgres_local_data:
  api_node_modules:

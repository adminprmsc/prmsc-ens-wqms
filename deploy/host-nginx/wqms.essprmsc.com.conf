# Host-level TLS terminator for WQMS (Water Quality).
# Docker edge must listen on 127.0.0.1:8080 (WEB_HTTP_PORT=127.0.0.1:8080).
#
# Install:
#   sudo cp deploy/host-nginx/wqms.essprmsc.com.conf /etc/nginx/sites-available/wqms.essprmsc.com
#   sudo ln -sf /etc/nginx/sites-available/wqms.essprmsc.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wqms.essprmsc.com

upstream wqms_docker {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wqms.essprmsc.com;

    location / {
        proxy_pass http://wqms_docker;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# Certbot adds a second server { listen 443 ssl; ... } block here after --nginx.

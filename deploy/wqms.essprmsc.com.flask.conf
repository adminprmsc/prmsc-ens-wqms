# Host Nginx → Flask/Gunicorn + SQLite app on :5000.
# Install (on VM as sudo):
#   sudo cp /home/prmsc101/wqms-flask/deploy/wqms.essprmsc.com.flask.conf \
#     /etc/nginx/sites-available/wqms.essprmsc.com
#   sudo ln -sf /etc/nginx/sites-available/wqms.essprmsc.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream wqms_flask {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name wqms.essprmsc.com 101.50.84.115;

    client_max_body_size 100M;

    location /static/ {
        alias /home/prmsc101/wqms-flask/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /uploads/ {
        alias /home/prmsc101/wqms-flask/uploads/;
        expires 7d;
    }

    location / {
        proxy_pass http://wqms_flask;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Registration</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px 0;
    }
    .registration-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      overflow: hidden;
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      margin: 20px;
    }
    .registration-image {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 100, 100, 0.6)), url("/static/images/register-bg.jpg") no-repeat center center;
      background-size: cover;
      flex: 1 1 40%;
      min-height: 400px;
      color: white;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .registration-form {
      flex: 1 1 60%;
      padding: 40px;
      min-width: 300px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-control:focus {
      border-color: #00b894;
      box-shadow: none;
    }
    .form-icon {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #1f2937;
      z-index: 2;
    }
    .form-control {
      padding-left: 40px;
      height: 45px;
      border-radius: 6px;
    }
    .form-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .form-row .form-group {
      flex: 1;
      min-width: 250px;
    }
    .submit-btn {
      background-color: #1f2937;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 0.375rem;
      transition: background-color 0.3s ease;
      width: 100%;
      margin-top: 20px;
    }
    .submit-btn:hover {
      background-color: #111827;
    }
    .role-selection {
      margin-bottom: 20px;
    }
    .role-label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1f2937;
    }
    .role-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .role-option {
      position: relative;
    }
    .role-option input[type="radio"] {
      display: none;
    }
    .role-option label {
      display: block;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s ease;
      background-color: #f9fafb;
    }
    .role-option input[type="radio"]:checked + label {
      border-color: #00b894;
      background-color: #e8f5e9;
      color: #00b894;
    }
    .role-option label:hover {
      border-color: #00b894;
    }
    /* Logo section responsive */
    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1rem;
    }
    .logo-section img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 15px auto;
    }
    /* Responsive breakpoints */
    @media (max-width: 1200px) {
      .logo-section img {
        width: 400px;
      }
      
      .registration-container {
        max-width: 1000px;
      }
    }
    @media (max-width: 992px) {
      .logo-section img {
        width: 350px;
      }
      
      .registration-container {
        flex-direction: column;
        margin: 10px;
      }
      
      .registration-image {
        flex: 1 1 100%;
        min-height: 300px;
        order: 1;
      }
      
      .registration-form {
        flex: 1 1 100%;
        padding: 30px;
        order: 2;
      }
      
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      
      .form-row .form-group {
        min-width: 100%;
      }
    }
    @media (max-width: 768px) {
      body {
        padding: 10px 0;
      }
      
      .logo-section {
        margin-bottom: 1rem;
        padding: 0.5rem;
      }
      
      .logo-section img {
        width: 280px;
      }
      
      .registration-container {
        margin: 5px;
        border-radius: 8px;
      }
      
      .registration-image {
        min-height: 250px;
        padding: 1.5rem;
      }
      
      .registration-image h1 {
        font-size: 1.5rem !important;
      }
      
      .registration-image h2 {
        font-size: 1.25rem !important;
      }
      
      .registration-image p {
        font-size: 0.9rem !important;
      }
      
      .registration-form {
        padding: 20px;
      }
      
      .registration-form h2 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
      
      .form-control {
        height: 50px;
        font-size: 16px; /* Prevents zoom on iOS */
      }
      
      .form-icon {
        top: 15px;
        left: 15px;
      }
      
      .form-control {
        padding-left: 45px;
      }
    }
    @media (max-width: 576px) {
      .logo-section img {
        width: 240px;
      }
      
      .registration-container {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
      }
      
      .registration-image {
        min-height: 200px;
        padding: 1rem;
      }
      
      .registration-image h1 {
        font-size: 1.25rem !important;
      }
      
      .registration-image h2 {
        font-size: 1.1rem !important;
      }
      
      .registration-image p {
        font-size: 0.85rem !important;
        margin-top: 1rem !important;
      }
      
      .registration-form {
        padding: 15px;
      }
      
      .registration-form h2 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }
      
      .form-group {
        margin-bottom: 15px;
      }
      
      .submit-btn {
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
      }
    }
    @media (max-width: 400px) {
      .logo-section img {
        width: 200px;
      }
      
      .registration-form {
        padding: 10px;
      }
      
      .form-control {
        padding-left: 40px;
      }
      
      .form-icon {
        left: 12px;
      }
    }
    /* Landscape orientation on mobile */
    @media (max-height: 600px) and (orientation: landscape) {
      body {
        align-items: flex-start;
        padding: 10px 0;
      }
      
      .logo-section {
        display: none;
      }
      
      .registration-container {
        margin: 10px;
        flex-direction: row;
      }
      
      .registration-image {
        flex: 1 1 35%;
        min-height: auto;
      }
      
      .registration-form {
        flex: 1 1 65%;
        padding: 20px;
      }
    }
    /* Print styles */
    @media print {
      .registration-image {
        display: none;
      }
      
      .registration-form {
        flex: 1 1 100%;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <!-- Logo section with responsive classes -->
   <div class="logo-section d-none d-sm-block">
  <img src="{{ url_for('static', filename='images/logo-image.png') }}" alt="Logo"
       class="img-fluid" style="width:200px; height:auto;">

  <img src="{{ url_for('static', filename='images/prmsc.svg') }}" alt="PRMSC"
     class="img-fluid" style="width:450px; height:auto;">

  <img src="{{ url_for('static', filename='images/tagline.svg') }}" alt="Tagline"
     class="img-fluid" style="width:450px; height:auto;">

  </div>


    <div class="d-flex justify-content-center align-items-center min-vh-10">
      <div class="registration-container">
        <div class="registration-image d-flex align-items-center justify-content-center text-white text-center">
        </div>
        <div class="registration-form">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="text-center fw-bold" style="color: #1f2937; margin: 0; flex: 1;">
              User Registration
            </h2>
            <a href="/login" style="color: #1f2937; text-decoration: none; font-weight: 600; font-size: 14px;">
              Already have an account? <span style="color: #007BFF;">Sign In</span>
            </a>
          </div>

          <form id="registrationForm" onsubmit="handleRegistration(event)">
            <!-- Name Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-user form-icon"></i>
                <input type="text" class="form-control" name="name" placeholder="Full Name" required>
              </div>
            </div>

            <!-- Email Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-envelope form-icon"></i>
                <input type="email" class="form-control" name="email" id="email" placeholder="Email Address" required>
              </div>
            </div>

            <!-- Role Selection -->
            <div class="role-selection">
              <label class="role-label">
                <i class="fas fa-user-tag"></i> Select Your Role
              </label>
              <div class="role-options">
                <div class="role-option">
                  <input type="radio" id="role_pcrwr" name="role_type" value="pcrwr_user" checked onchange="handleRoleChange()">
                  <label for="role_pcrwr">
                    <i class="fas fa-user"></i><br>
                    PCRWR User
                  </label>
                </div>
                <div class="role-option">
                  <input type="radio" id="role_env_wing" name="role_type" value="environmental_wing" onchange="handleRoleChange()">
                  <label for="role_env_wing">
                    <i class="fas fa-leaf"></i><br>
                    PRMSC Staff
                  </label>
                </div>
              </div>
            </div>

            <!-- Environmental Wing Sub-Role Selection (Hidden by default) -->
            <div class="role-selection" id="env_wing_selection" style="display: none; margin-top: 15px;">
              <label class="role-label">
                <i class="fas fa-briefcase"></i> Select Your Position
              </label>
              <div style="position: relative;">
                <i class="fas fa-chevron-down" style="position: absolute; right: 12px; top: 12px; color: #1f2937; pointer-events: none; z-index: 1;"></i>
                <select id="env_wing_role" name="role" class="form-control" style="appearance: none; padding-right: 40px;" onchange="handlePositionChange()">
                  <option value="">-- Select Position --</option>
                  <option value="environmental_specialist">Environmental Specialist</option>
                  <option value="research_analyst">Research Analyst</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <!-- Custom Position Input (Hidden by default, shown when "Other" is selected) -->
            <div class="form-row" id="custom_position_input" style="display: none; margin-top: 15px;">
              <div class="form-group position-relative">
                <i class="fas fa-briefcase form-icon"></i>
                <input type="text" class="form-control" id="custom_position" name="custom_position" placeholder="Please specify your position">
              </div>
            </div>

            <!-- Password Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-lock form-icon"></i>
                <input type="password" class="form-control" name="password" placeholder="Password" required>
              </div>
            </div>

            <!-- Confirm Password Row -->
            <div class="form-row">
              <div class="form-group position-relative">
                <i class="fas fa-lock form-icon"></i>
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn submit-btn">Register</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Flash messages handling -->
  <script>
    // Handle role type change
    function handleRoleChange() {
      const roleType = document.querySelector('input[name="role_type"]:checked').value;
      const envWingSelection = document.getElementById('env_wing_selection');
      const envWingRole = document.getElementById('env_wing_role');
      const customPositionInput = document.getElementById('custom_position_input');
      const customPositionField = document.getElementById('custom_position');

      if (roleType === 'environmental_wing') {
        envWingSelection.style.display = 'block';
        envWingRole.required = true;
      } else {
        envWingSelection.style.display = 'none';
        envWingRole.required = false;
        envWingRole.value = '';
        // Also hide and clear custom position field
        customPositionInput.style.display = 'none';
        customPositionField.required = false;
        customPositionField.value = '';
      }
    }

    // Handle position change for "Other" option
    function handlePositionChange() {
      const selectedPosition = document.getElementById('env_wing_role').value;
      const customPositionInput = document.getElementById('custom_position_input');
      const customPositionField = document.getElementById('custom_position');

      if (selectedPosition === 'other') {
        customPositionInput.style.display = 'block';
        customPositionField.required = true;
      } else {
        customPositionInput.style.display = 'none';
        customPositionField.required = false;
        customPositionField.value = '';
      }
    }

    async function handleRegistration(event) {
      event.preventDefault();

      const name = document.querySelector('input[name="name"]').value;
      const email = document.querySelector('input[name="email"]').value;
      const roleType = document.querySelector('input[name="role_type"]:checked').value;
      const password = document.querySelector('input[name="password"]').value;
      const confirmPassword = document.querySelector('input[name="confirm_password"]').value;

      // Determine the actual role
      let role = roleType;
      let customPosition = '';
      if (roleType === 'environmental_wing') {
        role = document.getElementById('env_wing_role').value;
        if (!role) {
          Swal.fire({
            icon: 'error',
            title: 'Missing Selection',
            text: 'Please select a position in Environmental Wing'
          });
          return;
        }

        // If "Other" is selected, get the custom position
        if (role === 'other') {
          customPosition = document.getElementById('custom_position').value.trim();
          if (!customPosition) {
            Swal.fire({
              icon: 'error',
              title: 'Missing Information',
              text: 'Please specify your position'
            });
            return;
          }
          // Store the custom position in the role field for display
          role = `other_${customPosition}`;
        }
      }

      // Validate passwords match
      if (password !== confirmPassword) {
        Swal.fire({
          icon: 'error',
          title: 'Password Mismatch',
          text: 'Passwords do not match!'
        });
        return;
      }

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            name,
            email,
            password,
            role
          })
        });

        const data = await response.json();

        if (data.success) {
          Swal.fire({
            icon: 'success',
            title: 'Registration Successful!',
            text: `Welcome ${name}! You have been registered successfully. Please login with your credentials.`,
            confirmButtonColor: '#00b894'
          }).then(() => {
            window.location.href = '/login';
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Registration Failed',
            text: data.message || 'An error occurred during registration'
          });
        }
      } catch (error) {
        console.error('Error:', error);
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'An error occurred during registration'
        });
      }
    }

    // Handle form submission success
    document.getElementById('registrationForm').addEventListener('submit', handleRegistration);
  </script>
  
  <!-- Add email validation script -->
  <script>
  document.getElementById('email').addEventListener('blur', function() {
      const email = this.value;
      if (email) {
          fetch(`/api/check-email?email=${encodeURIComponent(email)}`)
              .then(response => response.json())
              .then(data => {
                  if (data.exists) {
                      this.setCustomValidity('Email already registered');
                      this.reportValidity();
                  } else {
                      this.setCustomValidity('');
                  }
              });
      }
  });
  </script>
</body>
</html>

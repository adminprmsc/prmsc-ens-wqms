<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script>
    // Check if SweetAlert2 loaded successfully
    if (typeof Swal === 'undefined') {
        console.error('SweetAlert2 failed to load from CDN. Creating fallback...');
        window.Swal = {
            fire: function (title, text, icon) {
                if (typeof title === 'object') {
                    // Handle object parameter
                    const options = title;
                    return new Promise((resolve) => {
                        const message = options.text || options.title || '';
                        const confirmed = confirm(message);
                        resolve({ isConfirmed: confirmed, value: options.input ? prompt(options.inputLabel || '') : null });
                    });
                } else {
                    // Handle simple parameters
                    alert((title || '') + '\n' + (text || ''));
                    return Promise.resolve({ isConfirmed: true });
                }
            }
        };
    }

    // IIFE to avoid "already declared" errors on SPA navigation
    (function () {
        'use strict';

        // Use window properties to persist data across navigation
        if (!window.viewSubmissionsCurrentUser) {
            window.viewSubmissionsCurrentUser = null;
        }
        if (!window.viewSubmissionsAllSubmissions) {
            window.viewSubmissionsAllSubmissions = [];
        }
        // Persist currentReportId on window so it survives IIFE re-runs on SPA re-navigation
        if (window.viewSubmissionsCurrentReportId === undefined) {
            window.viewSubmissionsCurrentReportId = null;
        }
        let currentUser = window.viewSubmissionsCurrentUser;
        let allSubmissions = window.viewSubmissionsAllSubmissions;
        let currentReportId = window.viewSubmissionsCurrentReportId;

        // Load current user info
        async function loadCurrentUser() {
            try {
                console.log('🔄 Loading current user...');
                const response = await fetch('/api/auth/user');
                const data = await response.json();

                if (data.success) {
                    currentUser = window.viewSubmissionsCurrentUser = data.user;
                    console.log('✅ User loaded:', currentUser.name, '-', currentUser.role_display_name);

                    // Show status filter only for approvers
                    if (currentUser.can_view_status_column) {
                        const statusGroup = document.getElementById('statusFilterGroup');
                        if (statusGroup) {
                            statusGroup.style.display = 'flex';
                            
                            const filterStatus = document.getElementById('filterStatus');
                            if (filterStatus) {
                                // Add event listener to reload when status filter changes
                                filterStatus.addEventListener('change', () => {
                                    console.log('🔄 Status filter changed to:', filterStatus.value);
                                    loadSubmissions();
                                });
                            }
                        }
                    }

                    console.log('🔄 Loading submissions...');
                    setupFilterListeners();
                    loadSubmissions();
                } else {
                    console.warn('⚠️ User authentication failed, redirecting to login...');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('❌ Error loading user:', error);
                window.location.href = '/login';
            }
        }

        // Load submissions based on user role
        async function loadSubmissions() {
            try {
                // Show loading state
                const tableBody = document.getElementById('tableBody');
                if (tableBody) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="12" style="text-align: center; padding: 40px;">
                                <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: #667eea;"></i>
                                <p style="margin-top: 10px; color: #666;">Loading submissions...</p>
                            </td>
                        </tr>
                    `;
                }

                // Use the NEW test-reports endpoint
                let endpoint = '/api/test-reports';

                // Add filter parameters based on user role and status filter selection
                const params = new URLSearchParams();

                if (currentUser.can_view_status_column) {
                    // Get status from dropdown
                    const statusFilter = document.getElementById('filterStatus');
                    const selectedStatus = statusFilter ? statusFilter.value : 'pending';

                    // Map dropdown values to API status parameters
                    if (selectedStatus === 'pending') {
                        params.append('status', 'submitted,pending_review');
                    } else if (selectedStatus === 'all') {
                        params.append('status', 'submitted,pending_review,approved,rejected');
                    } else if (selectedStatus) {
                        params.append('status', selectedStatus);
                    }
                }

                const url = params.toString() ? `${endpoint}?${params}` : endpoint;
                console.log('📡 Fetching submissions from:', url);

                const response = await fetch(url);
                const data = await response.json();

                console.log('📦 API Response:', data);

                if (data.success) {
                    // Create deep copies of each report to avoid reference issues
                    allSubmissions = window.viewSubmissionsAllSubmissions = (data.reports || []).map(report => JSON.parse(JSON.stringify(report)));
                    console.log('✅ Loaded submissions:', allSubmissions.length);

                    // Debug: Check if quality_assessment data is present
                    if (allSubmissions.length > 0) {
                        console.log('📊 Sample submission data:', allSubmissions[0]);
                        console.log('🔬 Quality assessment in first submission:', allSubmissions[0].quality_assessment);
                    }

                    renderTable();
                } else {
                    console.error('❌ Failed to load submissions:', data.message);
                    showError('Failed to load submissions: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('❌ Error loading submissions:', error);
                showError('Error loading submissions: ' + error.message);
            }
        }

        // Helper function to generate quality badge HTML
        function getQualityBadge(value) {
            if (!value || value === null || value === undefined) {
                return '<span class="quality-not-set">-</span>';
            }

            const valueLower = value.toLowerCase();
            let badgeClass = '';
            let displayText = value.charAt(0).toUpperCase() + value.slice(1);

            if (valueLower === 'safe') {
                badgeClass = 'quality-safe';
            } else if (valueLower === 'unsafe') {
                badgeClass = 'quality-unsafe';
            } else if (valueLower === 'contaminated') {
                badgeClass = 'quality-contaminated';
            } else if (valueLower === 'n/a') {
                badgeClass = 'quality-na';
                displayText = 'N/A';
            } else {
                badgeClass = 'quality-na';
            }

            return `<span class="quality-badge ${badgeClass}">${displayText}</span>`;
        }

        // Render table based on user role
        function renderTable() {
            console.log('🎨 renderTable() called');
            console.log('📊 Number of submissions to render:', allSubmissions.length);
            console.log('👤 Current user:', currentUser);

            const isApprover = currentUser.can_view_status_column;
            const isPCRWR = !isApprover;

            // Set table headers
            const headerRow = document.getElementById('tableHeader');
            if (!headerRow) {
                console.error('❌ tableHeader element not found!');
                return;
            }
            headerRow.innerHTML = '';

            const headers = isPCRWR
                ? ['Sr.', 'Test ID', 'Village', 'Tehsil', 'Submission Date', 'Test Type', 'Work Order No', 'Physical Quality', 'Chemical Quality', 'Trace Elements Quality', 'Microbial Quality', 'Remarks', 'Overall Result', 'Report']
                : ['Sr.', 'Test ID', 'Village', 'Tehsil', 'Submission Date', 'Test Type', 'Work Order No', 'Physical Quality', 'Chemical Quality', 'Trace Elements Quality', 'Microbial Quality', 'Remarks', 'Overall Result', 'Status', 'Report', 'Actions'];

            const columnStyles = {
                'Sr.': 'col-sr',
                'Test ID': 'col-testid',
                'Village': 'col-village',
                'Tehsil': 'col-tehsil',
                'Submission Date': 'col-date',
                'Test Type': 'col-type',
                'Work Order No': 'col-workorder',
                'Physical Quality': 'col-quality',
                'Chemical Quality': 'col-quality',
                'Trace Elements Quality': 'col-quality',
                'Microbial Quality': 'col-quality',
                'Remarks': 'col-remarks',
                'Overall Result': 'col-overall',
                'Status': 'col-status',
                'Report': 'col-report',
                'Actions': 'col-action'
            };

            console.log('📋 Table headers:', headers);

            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                const styleClass = columnStyles[header] || '';
                if (styleClass) {
                    th.className = styleClass;
                }
                headerRow.appendChild(th);
            });

            // Populate table body
            const tableBody = document.getElementById('tableBody');
            if (!tableBody) {
                console.error('tableBody element not found!');
                return;
            }
            tableBody.innerHTML = '';

            if (allSubmissions.length === 0) {
                console.log('ℹ️ No submissions to display');
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="${headers.length}" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No submissions found</p>
                        </td>
                    </tr>
                `;
                return;
            }

            console.log('✅ Rendering', allSubmissions.length, 'submissions...');

            allSubmissions.forEach((submission, index) => {
                const row = document.createElement('tr');
                const testId = submission.report_serial_no || `TEST-${String(submission.report_id).padStart(5, '0')}`;
                const testDate = submission.sampling_datetime ? new Date(submission.sampling_datetime).toLocaleDateString() : '-';
                // Tag row index for filter reference
                row.dataset.submissionIndex = index;

                // Get test type badge
                const formType = submission.form_type || 'priority';
                const testTypeClass = `test-type-${formType}`;
                const testTypeText = formType === 'priority' ? 'Priority Parameters' : 'Full Parameters';
                const isBaseline = (submission.report_category === 'baseline_report');
                const categoryBadge = isBaseline
                    ? `<span class="baseline-badge"><i class="fas fa-bookmark" style="font-size:9px;"></i> Baseline</span>`
                    : `<span class="baseline-badge" style="background:#5a67d8;color:#fff;border-color:#4c51bf;"><i class="fas fa-flask" style="font-size:9px;"></i> Post-intervention</span>`;
                const testTypeBadge = `<span class="test-type-badge ${testTypeClass}">${testTypeText}</span>${categoryBadge}`;

                // Get quality assessment data
                const qa = submission.quality_assessment || {};

                // Determine quality values based on form type
                let physicalQuality, chemicalQuality, traceElementsQuality, microbialQuality;

                if (formType === 'priority') {
                    // Priority Parameters: Only Physical and Microbial
                    physicalQuality = getQualityBadge(qa.physical_quality);
                    chemicalQuality = getQualityBadge('N/A');
                    traceElementsQuality = getQualityBadge('N/A');
                    microbialQuality = getQualityBadge(qa.microbial_quality);
                } else {
                    // Full Parameters: All four quality assessments
                    physicalQuality = getQualityBadge(qa.physical_quality);
                    chemicalQuality = getQualityBadge(qa.chemical_quality);
                    traceElementsQuality = getQualityBadge(qa.trace_elements_quality);
                    microbialQuality = getQualityBadge(qa.microbial_quality);
                }

                // Get remarks (wrapped text display)
                const remarks = qa.remarks || '-';
                const remarksDisplay = `<span class="remarks-cell" title="${remarks}">${remarks}</span>`;

                // Calculate Overall Result - unsafe if ANY quality field is "unsafe"
                let overallResult = 'safe';
                const qualityFields = formType === 'priority'
                    ? [qa.physical_quality, qa.microbial_quality]
                    : [qa.physical_quality, qa.chemical_quality, qa.trace_elements_quality, qa.microbial_quality];

                for (const q of qualityFields) {
                    if (q && q.toLowerCase() === 'unsafe') {
                        overallResult = 'unsafe';
                        break;
                    }
                }
                const overallResultBadge = `<span class="overall-${overallResult}">${overallResult.toUpperCase()}</span>`;
                // Stamp the computed result onto the row for the filter to read
                row.dataset.overallResult = overallResult;

                // Download Button
                const downloadBtn = `
                    <button class="btn" style="background: #667eea; color: white; padding: 6px 10px;" onclick="downloadReportPDF(${submission.report_id})" title="Download PDF">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                `;

                if (isPCRWR) {
                    // PCRWR User
                    row.innerHTML = `
                        <td class="${columnStyles['Sr.']}" style="text-align:center;font-weight:600;color:#64748b;">${index + 1}</td>
                        <td class="${columnStyles['Test ID']}">${testId}</td>
                        <td class="${columnStyles['Village']}">${submission.village || '-'}</td>
                        <td class="${columnStyles['Tehsil']}">${submission.tehsil || '-'}</td>
                        <td class="${columnStyles['Submission Date']}">${testDate}</td>
                        <td class="${columnStyles['Test Type']}">${testTypeBadge}</td>
                        <td class="${columnStyles['Work Order No']}">${submission.work_order_no || '-'}</td>
                        <td class="${columnStyles['Physical Quality']}">${physicalQuality}</td>
                        <td class="${columnStyles['Chemical Quality']}">${chemicalQuality}</td>
                        <td class="${columnStyles['Trace Elements Quality']}">${traceElementsQuality}</td>
                        <td class="${columnStyles['Microbial Quality']}">${microbialQuality}</td>
                        <td class="${columnStyles['Remarks']}">${remarksDisplay}</td>
                        <td class="${columnStyles['Overall Result']}">${overallResultBadge}</td>
                        <td class="${columnStyles['Report']}">${downloadBtn}</td>
                    `;
                } else {
                    // Approver
                    const statusClass = `status-${submission.status}`;
                    const statusText = submission.status.replace('_', ' ').toUpperCase();

                    row.innerHTML = `
                        <td class="${columnStyles['Sr.']}" style="text-align:center;font-weight:600;color:#64748b;">${index + 1}</td>
                        <td class="${columnStyles['Test ID']}">${testId}</td>
                        <td class="${columnStyles['Village']}">${submission.village || '-'}</td>
                        <td class="${columnStyles['Tehsil']}">${submission.tehsil || '-'}</td>
                        <td class="${columnStyles['Submission Date']}">${testDate}</td>
                        <td class="${columnStyles['Test Type']}">${testTypeBadge}</td>
                        <td class="${columnStyles['Work Order No']}">${submission.work_order_no || '-'}</td>
                        <td class="${columnStyles['Physical Quality']}">${physicalQuality}</td>
                        <td class="${columnStyles['Chemical Quality']}">${chemicalQuality}</td>
                        <td class="${columnStyles['Trace Elements Quality']}">${traceElementsQuality}</td>
                        <td class="${columnStyles['Microbial Quality']}">${microbialQuality}</td>
                        <td class="${columnStyles['Remarks']}">${remarksDisplay}</td>
                        <td class="${columnStyles['Overall Result']}">${overallResultBadge}</td>
                        <td class="${columnStyles['Status']}"><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td class="${columnStyles['Report']}">${downloadBtn}</td>
                        <td class="${columnStyles['Actions']}">
                            <div class="actions">
                                <button class="btn btn-view" onclick="viewDetails(${submission.report_id})">
                                    <i class="fas fa-eye"></i> View
                                </button>
                            </div>
                        </td>
                    `;
                }

                tableBody.appendChild(row);
            });

            console.log('✅ renderTable() completed successfully!');
            console.log('📊 Table now has', tableBody.children.length, 'rows');

            // Populate filter dropdowns after rendering
            populateFilterDropdowns();
        }

        // Populate filter dropdowns based on actual data
        function populateFilterDropdowns() {
            const tehsilSet = new Set();
            const villageSet = new Set();
            const testTypeSet = new Set();
            const workOrderSet = new Set();

            // Collect unique values from all submissions
            allSubmissions.forEach(submission => {
                if (submission.tehsil) tehsilSet.add(submission.tehsil);
                if (submission.village) villageSet.add(submission.village);
                if (submission.form_type) testTypeSet.add(submission.form_type);
                if (submission.work_order_no) workOrderSet.add(submission.work_order_no);
            });

            // Populate Tehsil dropdown
            const tehsilSelect = document.getElementById('filterTehsil');
            if (tehsilSelect) {
                const currentValue = tehsilSelect.value;
                tehsilSelect.innerHTML = '<option value="">All Tehsils</option>';
                Array.from(tehsilSet).sort().forEach(tehsil => {
                    const option = document.createElement('option');
                    option.value = tehsil;
                    option.textContent = tehsil;
                    tehsilSelect.appendChild(option);
                });
                tehsilSelect.value = currentValue; // Preserve selection
            }

            // Populate Village dropdown
            const villageSelect = document.getElementById('filterVillage');
            if (villageSelect) {
                const currentValue = villageSelect.value;
                villageSelect.innerHTML = '<option value="">All Villages</option>';
                Array.from(villageSet).sort().forEach(village => {
                    const option = document.createElement('option');
                    option.value = village;
                    option.textContent = village;
                    villageSelect.appendChild(option);
                });
                villageSelect.value = currentValue; // Preserve selection
            }

            // Populate Test Type dropdown
            const testTypeSelect = document.getElementById('filterTestType');
            if (testTypeSelect) {
                const currentValue = testTypeSelect.value;
                testTypeSelect.innerHTML = '<option value="">All Types</option>';
                Array.from(testTypeSet).sort().forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type === 'priority' ? 'Priority Parameters' : 'Full Parameters';
                    testTypeSelect.appendChild(option);
                });
                testTypeSelect.value = currentValue; // Preserve selection
            }

            // Populate Work Order No dropdown
            const workOrderSelect = document.getElementById('filterWorkOrderNo');
            if (workOrderSelect) {
                const currentValue = workOrderSelect.value;
                workOrderSelect.innerHTML = '<option value="">All Work Orders</option>';

                // Add static values 1-500
                for (let i = 1; i <= 500; i++) {
                    const option = document.createElement('option');
                    option.value = i.toString();
                    option.textContent = i.toString();
                    workOrderSelect.appendChild(option);
                }

                // Also add any database values that are not in 1-500 range
                Array.from(workOrderSet).forEach(workOrder => {
                    const workOrderNum = parseInt(workOrder);
                    if (isNaN(workOrderNum) || workOrderNum < 1 || workOrderNum > 500) {
                        const option = document.createElement('option');
                        option.value = workOrder;
                        option.textContent = workOrder;
                        workOrderSelect.appendChild(option);
                    }
                });

                workOrderSelect.value = currentValue; // Preserve selection
            }
        }

        // Apply filters and search to the table
        function applyFilters() {
            const tehsilFilter = document.getElementById('filterTehsil')?.value?.toLowerCase() || '';
            const villageFilter = document.getElementById('filterVillage')?.value?.toLowerCase() || '';
            const testTypeFilter = document.getElementById('filterTestType')?.value?.toLowerCase() || '';
            const workOrderFilter = document.getElementById('filterWorkOrderNo')?.value?.toLowerCase() || '';
            const overallResultFilter = document.getElementById('filterOverallResult')?.value?.toLowerCase() || '';
            const searchQuery = document.getElementById('submissionsSearch')?.value?.toLowerCase() || '';

            const tableBody = document.getElementById('tableBody');
            if (!tableBody) return;

            const rows = tableBody.querySelectorAll('tr');

            rows.forEach((row) => {
                if (row.querySelector('.empty-state') || row.querySelector('.fa-spinner')) {
                    return; // Skip loading/empty rows
                }

                // Use the submission index stamped on the row during rendering
                const idx = parseInt(row.dataset.submissionIndex, 10);
                const submission = isNaN(idx) ? null : allSubmissions[idx];
                if (!submission) return;

                // Match dropdown filters
                const tehsilMatch = !tehsilFilter || (submission.tehsil && submission.tehsil.toLowerCase() === tehsilFilter);
                const villageMatch = !villageFilter || (submission.village && submission.village.toLowerCase() === villageFilter);
                const testTypeMatch = !testTypeFilter || (submission.form_type && submission.form_type.toLowerCase() === testTypeFilter);
                const workOrderMatch = !workOrderFilter || (submission.work_order_no && submission.work_order_no.toLowerCase() === workOrderFilter);

                // Match Overall Result filter — read from the data attribute stamped during render
                const rowOverallResult = (row.dataset.overallResult || '').toLowerCase();
                const overallResultMatch = !overallResultFilter || rowOverallResult === overallResultFilter;

                // Match search query across all readable columns (from DOM text)
                let searchMatch = true;
                if (searchQuery) {
                    const cells = Array.from(row.querySelectorAll('td'));
                    const searchableTexts = cells
                        .filter(cell => !cell.querySelector('button') && !cell.querySelector('.actions') && !cell.classList.contains('col-report') && !cell.classList.contains('col-action'))
                        .map(cell => cell.textContent.trim().toLowerCase());

                    const searchTerms = searchQuery.split(/\s+/).filter(term => term.length > 0);
                    searchMatch = searchTerms.every(term =>
                        searchableTexts.some(text => text.includes(term))
                    );
                }

                row.style.display = (tehsilMatch && villageMatch && testTypeMatch && workOrderMatch && overallResultMatch && searchMatch) ? '' : 'none';
            });
        }

        // Add filter event listeners
        function setupFilterListeners() {
            const filterTehsil = document.getElementById('filterTehsil');
            const filterVillage = document.getElementById('filterVillage');

        // View submission details - open modal with form
        let currentReportData = null;
        let isEditMode = false;
        let originalFormData = null;

        async function viewDetails(testId) {
            console.log('Opening form modal for test report:', testId);
            currentReportId = window.viewSubmissionsCurrentReportId = testId;
            isEditMode = false;

            try {
                // Fetch report data
                const response = await fetch(`/api/test-reports/${testId}`);
                const data = await response.json();

                if (data.success) {
                    currentReportData = data.report;
                    originalFormData = JSON.parse(JSON.stringify(data.report)); // Deep copy

                    // Update modal title
                    const formType = data.report.form_type === 'priority' ? 'Priority Parameters' : 'Full Parameters';
                    document.getElementById('modalFormTitle').textContent = `Test Report - ${formType}`;

                    // Load form structure and populate data
                    await loadFormStructure(data.report.form_type);
                    populateModalForm(data.report);

                    // Update status badge
                    updateModalStatusBadge(data.report.status);

                    // Update action buttons
                    updateModalButtons(data.report);

                    // Make form read-only initially
                    setFormReadOnly(true);

                    // Show modal
                    document.getElementById('formViewModal').style.display = 'block';
                    document.getElementById('modalFormContainer').classList.add('active');
                } else {
                    Swal.fire('Error', 'Failed to load report: ' + (data.message || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Error loading report:', error);
                Swal.fire('Error', 'Error loading report: ' + error.message, 'error');
            }
        }

        // Close form modal
        function closeFormModal() {
            console.log('closeFormModal() called, isEditMode:', isEditMode);
            if (isEditMode) {
                Swal.fire({
                    title: 'Discard Changes?',
                    text: 'You have unsaved changes. Are you sure you want to close?',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#f44336',
                    cancelButtonColor: '#999',
                    confirmButtonText: 'Yes, Discard'
                }).then((result) => {
                    if (result.isConfirmed) {
                        document.getElementById('formViewModal').style.display = 'none';
                        document.getElementById('modalFormContainer').classList.remove('active');
                        isEditMode = false;
                        currentReportId = window.viewSubmissionsCurrentReportId = null;
                        currentReportData = null;
                    }
                });
            } else {
                document.getElementById('formViewModal').style.display = 'none';
                document.getElementById('modalFormContainer').classList.remove('active');
                currentReportId = window.viewSubmissionsCurrentReportId = null;
                currentReportData = null;
            }
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('formViewModal');
            if (event.target === modal) {
                closeFormModal();
            }
        }

        // Apply visibility based on form type

            console.log('🔍 Applying form type visibility for:', formType);

            const formContainer = document.getElementById('modalWaterTestForm');
            if (!formContainer) return;

            // Get all sections with data-form-type attribute
            const allSections = formContainer.querySelectorAll('[data-form-type]');

            allSections.forEach(section => {
                const sectionFormType = section.getAttribute('data-form-type');

                if (sectionFormType === 'both') {
                    // Always show sections marked as 'both'
                    section.style.display = '';
                } else if (sectionFormType === 'full') {
                    // Show only for full form type
                    section.style.display = formType === 'full' ? '' : 'none';
                } else if (sectionFormType === 'priority') {
                    // Show only for priority form type
                    section.style.display = formType === 'priority' ? '' : 'none';

        // Helper function to set modal field value
        function setModalFieldValue(fieldId, value) {
            const field = document.getElementById(fieldId);
            if (!field) {
                return;
            }

            // Set value even if it's null/undefined (to clear the field)
            if (value !== null && value !== undefined) {
                // For select elements, ensure the value exists as an option
                if (field.tagName === 'SELECT') {
                    const optionExists = Array.from(field.options).some(opt => opt.value === String(value));
                    if (optionExists) {
                        field.value = value;
                    } else {
                        field.value = '';
                    }
                } else {
                    field.value = value;
                }
            } else {
                field.value = '';
            }
        }

        // Helper function to format datetime for input field
        function formatDateTimeForInput(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toISOString().slice(0, 16); // Format: YYYY-MM-DDTHH:mm
        }

        // Helper function to format date for input field
        function formatDateForInput(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toISOString().slice(0, 10); // Format: YYYY-MM-DD
        }

        // Set form read-only or editable
        function setFormReadOnly(readonly) {
            const form = document.getElementById('modalWaterTestForm');
            if (!form) return;

            const fields = form.querySelectorAll('input, select, textarea');
            fields.forEach(field => {
                if (readonly) {
                    field.setAttribute('disabled', 'disabled');
                    field.classList.add('form-field-readonly');
                    field.classList.remove('form-field-editable');
                } else {
                    field.removeAttribute('disabled');
                    field.classList.remove('form-field-readonly');
                    field.classList.add('form-field-editable');
                }
            });
        }

            console.log('enableEditMode() called');
            isEditMode = true;
            setFormReadOnly(false);

            // Show edit mode indicator

            if (indicator) {
                indicator.classList.add('active');
            }

            // Update buttons
            const btnEdit = document.getElementById('btnEdit');
            const btnSave = document.getElementById('btnSave');
            const btnCancelEdit = document.getElementById('btnCancelEdit');
            const btnApprove = document.getElementById('btnApprove');
            const btnReject = document.getElementById('btnReject');

            if (btnEdit) btnEdit.style.display = 'none';
            if (btnSave) btnSave.style.display = 'inline-block';
            if (btnCancelEdit) btnCancelEdit.style.display = 'inline-block';
            if (btnApprove) btnApprove.style.display = 'none';
            if (btnReject) btnReject.style.display = 'none';

                Swal.fire('Error', 'No report selected for approval', 'error');
                return;

            const result = await Swal.fire({
                title: 'Approve Submission?',
                text: 'Are you sure you want to approve this submission?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4CAF50',
                cancelButtonColor: '#999',
                confirmButtonText: 'Yes, Approve'

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },

        // Reject from modal
        async function rejectFromModal() {
            const reportId = currentReportId || window.viewSubmissionsCurrentReportId;
            if (!reportId) {
                Swal.fire('Error', 'No report selected for rejection', 'error');
                return;
            }
            const result = await Swal.fire({
                title: 'Reject Submission?',
                input: 'textarea',
                inputLabel: 'Rejection Reason',
                inputPlaceholder: 'Enter reason for rejection...',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#f44336',
                cancelButtonColor: '#999',
                confirmButtonText: 'Yes, Reject',
                inputValidator: (value) => {
                    if (!value) {
                        return 'You must provide a rejection reason!';
                    }
                }
            });

            if (result.isConfirmed && result.value) {
                try {
                    const response = await fetch(`/api/test-reports/${reportId}/reject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rejection_reason: result.value })
                    });

                    const data = await response.json();

                    if (data.success) {
                        await Swal.fire('Rejected!', 'Submission rejected successfully', 'success');
                        closeFormModal();
                        loadSubmissions();
                    } else {
                        Swal.fire('Error', data.message || 'Failed to reject submission', 'error');

                } catch (error) {
                    console.error('Error:', error);
                    Swal.fire('Error', 'Error rejecting submission', 'error');
                }
            }
        }

        // Initialize - handle both cases: DOM already loaded or still loading
        function initializePage() {
            console.log('🚀 Initializing View Submissions page...');
            console.log('📍 Document ready state:', document.readyState);
            loadCurrentUser();
        }

        // Check if DOM is already loaded (script at end of body)
        if (document.readyState === 'loading') {
            // DOM is still loading, wait for it
            console.log('⏳ DOM is still loading, waiting for DOMContentLoaded...');
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            // DOM is already loaded (script at end of body)
            console.log('✅ DOM already loaded, initializing immediately...');
            initializePage();
        }

        // Go to dashboard using SPA navigation
        function goToDashboard() {
            // loadPage is defined in parent index.html and attached to window
            if (typeof window.loadPage === 'function') {
                // Find and activate the dashboard nav item
                const dashboardNavItem = document.querySelector('.nav-item[onclick*="/dashboard"]');
                if (dashboardNavItem) {
                    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                    dashboardNavItem.classList.add('active');
                }
                window.loadPage('/dashboard', dashboardNavItem);
            } else {
                // Fallback to direct navigation
                window.location.href = '/dashboard';
            }
        }
